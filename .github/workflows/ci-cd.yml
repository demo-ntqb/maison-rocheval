name: CI/CD

on:
  pull_request:
    branches: [main, production]
  push:
    branches: [main, production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  VERCEL_CLI_VERSION: "58.9.4"

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The quality gate builds without Vercel secrets; let it fall back to the
      # mock.shop catalog instead of failing the build. Production deploys must
      # NOT set this — the storefront config fails closed there.
      ALLOW_MOCK_CATALOG: "true"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Verify CI/CD contract
        run: yarn test:cicd

      - name: Build application
        run: yarn build

  deploy_preview:
    name: Deploy Preview
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ github.base_ref == 'production' && secrets.VERCEL_PROJECT_ID || secrets.VERCEL_UAT_PROJECT_ID }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure Git Author for Vercel
        run: |
          git config --global user.email "[EMAIL_ADDRESS_VERCEL]"
          git commit --amend --reset-author --no-edit

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install pinned Vercel CLI
        run: npm install --global "vercel@$VERCEL_CLI_VERSION"

      - name: Pull Vercel Preview environment
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build Vercel Preview artifact
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy Vercel Preview artifact
        id: deploy
        shell: bash
        run: |
          deployment_url="$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Add Preview URL to summary
        shell: bash
        run: |
          echo "### Vercel Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"

  deploy_uat:
    name: Deploy UAT
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: uat
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_UAT_PROJECT_ID }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure Git Author for Vercel
        run: |
          git config --global user.name "Binh Nguyen"
          git config --global user.email "ytbntq001@gmail.com"
          git commit --amend --reset-author --no-edit

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install pinned Vercel CLI
        run: npm install --global "vercel@$VERCEL_CLI_VERSION"

      - name: Pull Vercel Production environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel Production artifact
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy Vercel Production artifact
        id: deploy
        shell: bash
        run: |
          deployment_url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Add UAT URL to summary
        shell: bash
        run: |
          echo "### Vercel UAT" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"

  deploy_production:
    name: Deploy Production
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure Git Author for Vercel
        run: |
          git config --global user.name "Binh Nguyen"
          git config --global user.email "ytbntq001@gmail.com"
          git commit --amend --reset-author --no-edit

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install pinned Vercel CLI
        run: npm install --global "vercel@$VERCEL_CLI_VERSION"

      - name: Pull Vercel Production environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel Production artifact
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy Vercel Production artifact
        id: deploy
        shell: bash
        run: |
          deployment_url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Add Production URL to summary
        shell: bash
        run: |
          echo "### Vercel Production" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"

